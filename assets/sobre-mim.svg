 stroke-width="1.5"/><text x="28" y="82" text-anchor="start" fill="#fff" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" >Olá, eu sou o Davi Ferreira!</text><rect x="26" y="67" width="264" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.31s 0.40s steps(28) forwards"/><text x="28" y="104" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" ></text><rect x="26" y="89" width="21" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.01s 0.81s steps(1) forwards"/><text x="28" y="126" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" >Minha jornada na tecnologia não começou apenas digitando código em uma tela, mas</text><rect x="26" y="111" width="732" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.88s 0.92s steps(80) forwards"/><text x="28" y="148" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" >projetando lógicas complexas em competições de robótica. Hoje, aplico esse mesmo</text><rect x="26" y="133" width="732" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.88s 1.90s steps(80) forwards"/><text x="28" y="170" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" >pensamento sistêmico e capacidade de resolução de problemas no desenvolvimento</text><rect x="26" y="155" width="714" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.86s 2.88s steps(78) forwards"/><text x="28" y="192" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" >de software full stack.</text><rect x="26" y="177" width="219" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.25s 3.84s steps(23) forwards"/><text x="28" y="214" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" ></text><rect x="26" y="199" width="21" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.01s 4.19s steps(1) forwards"/><text x="28" y="236" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" >Com 2 anos de vivência prática em TI (como Jovem Aprendiz), desenvolvi uma visão</text><rect x="26" y="221" width="732" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.88s 4.30s steps(80) forwards"/><text x="28" y="258" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" >holística que vai desde a infraestrutura até a experiência final do usuário,</text><rect x="26" y="243" width="696" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.84s 5.28s steps(76) forwards"/><text x="28" y="280" text-anchor="start" fill="#ccc" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" >unindo suporte, arquitetura e desenvolvimento de produto.</text><rect x="26" y="265" width="525" height="21" fill="#000" style="transform-box:fill-box;transform-origin:right;animation:rev 0.63s 6.22s steps(57) forwards"/><rect class="cur" x="760" y="286" width="12" height="8" fill="#fff"/></svg>